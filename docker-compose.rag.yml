services:
  retrieval:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      QDRANT_URL: ${QDRANT_URL:-https://qdrant.ndtd.indevs.in:443}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_CHAT_COLLECTION: ${QDRANT_CHAT_COLLECTION:-flood_kb_active}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:?Set the shared retrieval token}
    volumes:
      - ./data:/app/data:ro
      - rag_models:/models
    restart: unless-stopped
volumes:
  rag_models:
